[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deva-intelligence"
version = "0.1.0"
description = "DEVA INTELLIGENCE - AI-Powered Technology Intelligence SaaS Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "torch>=2.2.0; platform_system != 'Windows' or python_version < '3.13'",
    "sentence-transformers>=3.0.0",
    "mlflow>=2.14.0",
    "numpy>=1.26.0",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:hydra_pytest"
env = [
    "TESTING=True",
    "ENVIRONMENT=test",
]


[tool.ruff]
line-length = 100
target-version = "py310"
