name: DEVA Intelligence CI/CD Quality & Release Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-evals:
    name: Backend Tests & Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: deva_admin
          POSTGRES_PASSWORD: deva_secure_admin_pass
          POSTGRES_DB: deva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-env

      - name: Run Database Migrations
        working-directory: backend
        env:
          DATABASE_URL_SYNC: postgresql://deva_admin:deva_secure_admin_pass@localhost:5432/deva_test
          DATABASE_URL: postgresql+asyncpg://deva_admin:deva_secure_admin_pass@localhost:5432/deva_test
        run: |
          alembic upgrade head

      - name: Execute Full Pytest Suite (Phases 0-9 & Reranker)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://deva_admin:deva_secure_admin_pass@localhost:5432/deva_test
          DATABASE_URL_SYNC: postgresql://deva_admin:deva_secure_admin_pass@localhost:5432/deva_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          TESTING: "True"
        run: |
          pytest -v tests/

      - name: Run MLflow Release Quality Gates
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://deva_admin:deva_secure_admin_pass@localhost:5432/deva_test
          DATABASE_URL_SYNC: postgresql://deva_admin:deva_secure_admin_pass@localhost:5432/deva_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          TESTING: "True"
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          python -m evals.run_release_gate

  frontend-build:
    name: Frontend Lint & TypeScript Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript & Vite Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build & Validate Production Container Images
    runs-on: ubuntu-latest
    needs: [ backend-quality-and-evals, frontend-build ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infra/docker/backend.prod.Dockerfile
          push: false
          tags: deva/backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infra/docker/frontend.prod.Dockerfile
          push: false
          tags: deva/frontend:latest
