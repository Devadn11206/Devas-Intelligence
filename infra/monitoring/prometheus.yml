global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "deva-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["api:8000"]
        labels:
          application: "deva-intelligence"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
